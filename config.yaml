window:
  process_names:
    - "Classic.exe"
  title_contains:
    - "Classic"
    - "Ragnarok"
    - "Soulbound"

bot:
  stop_hotkey: "f12"
  pause_hotkey: "f11"
  debug_hotkey: "f10"
  loop_delay_ms: 120
  attack_wait_seconds: 1.15
  no_target_move_after_seconds: 0.75
  target_reclick_cooldown_seconds: 1.8

player:
  center_x_ratio: 0.50
  center_y_ratio: 0.46

hp:
  enabled: false
  roi:
    x_ratio: 0.480
    y_ratio: 0.514
    width_ratio: 0.040
    height_ratio: 0.012
  heal_below_percent: 55
  emergency_below_percent: 20
  heal_key: "f8"
  emergency_key: "f9"
  cooldown_seconds: 0.8

targeting:
  template_threshold: 0.56
  grayscale_threshold: 0.58
  edge_threshold: 0.42
  scales: [0.90, 1.00, 1.10]
  click_y_offset: 0
  max_target_distance_px: 700
  min_target_distance_px: 35
  excluded_regions:
    - [0.00, 0.00, 0.41, 0.11]
    - [0.00, 0.66, 0.38, 1.00]
    - [0.77, 0.00, 1.00, 0.34]

movement:
  enabled: true
  # Hold the mouse button and continuously travel in one direction.
  hold_radius_px: 330
  steer_interval_seconds: 0.45
  steer_jitter_radians: 0.06
  heading_hold_min_seconds: 3.5
  heading_hold_max_seconds: 7.0
  major_turn_radians: 0.50
  new_heading_max_turn_radians: 1.10

minimap:
  enabled: true
  # Calibrated for the 1600x900 Soulbound client screenshots.
  # The bot reads the top-right minimap directly from the game window.
  roi:
    x_ratio: 0.914
    y_ratio: 0.018
    width_ratio: 0.086
    height_ratio: 0.145
  auto_calibrate_rotation: true
  rotation_offset_radians: 0.0
  calibration_min_move_pixels: 1.2
  calibration_alpha: 0.18

  # Video-calibrated minimap parsing / path selection.
  arrow_value_min: 205
  arrow_saturation_max: 85
  arrow_border_margin_px: 5
  arrow_min_area: 5
  arrow_max_area: 95
  arrow_max_jump_px: 18

  walkable_saturation_max: 105
  walkable_value_min: 42
  walkable_value_max: 225
  bottom_ui_ignore_px: 10
  close_kernel: 3
  min_walkable_component_area: 18
  player_connect_radius_px: 4

  route_search_pixels: 80
  minimum_goal_distance_pixels: 16
  path_lookahead_pixels: 14
  minimum_clearance_px: 1.0
  distance_weight: 1.0
  clearance_weight: 4.0
  visited_penalty: 12.0
  visited_decay: 0.997
  visited_mark_radius_px: 4
  turn_penalty: 3.0

  stuck_frames: 12
  stuck_turn_radians: 2.15
  max_heading_change_radians: 0.32

world:
  enabled: true
  # Current test map: Byalan Dungeon F3.
  # Later this will be detected automatically on map changes.
  current_map: "iz_dun02"

  # Leave blank to auto-discover Desktop\Ragnarokmap\processed.
  database_path: ""

  # The in-game minimap shows the whole map. These values convert the
  # white arrow location to real GAT cell coordinates.
  invert_y: true
  minimap_padding_left_ratio: 0.03
  minimap_padding_right_ratio: 0.03
  minimap_padding_top_ratio: 0.03
  minimap_padding_bottom_ratio: 0.08

  exploration_min_distance_cells: 45
  exploration_max_distance_cells: 120
  exploration_attempts: 250
  snap_radius_cells: 12
  waypoint_spacing_cells: 8
  waypoint_reached_radius_cells: 4.0
  goal_reached_radius_cells: 5.0

loot:
  enabled: true
  sweep_after_target_disappears: true
  settle_delay_seconds: 0.18
  radius_px: 24
  rings: 2
  points_per_ring: 8
  click_delay_seconds: 0.045

debug:
  save_detection_frame: true
  output_path: "debug_last.jpg"
  minimap_output_path: "debug_minimap.jpg"
