window:
  process_names:
    - "Classic.exe"
  title_contains:
    - "Classic"
    - "Ragnarok"
    - "Soulbound"

bot:
  stop_hotkey: "f12"
  pause_hotkey: "f11"
  debug_hotkey: "f10"
  loop_delay_ms: 120
  attack_wait_seconds: 1.15
  no_target_move_after_seconds: 1.5
  target_reclick_cooldown_seconds: 1.8

player:
  center_x_ratio: 0.50
  center_y_ratio: 0.46

hp:
  enabled: false
  roi:
    x_ratio: 0.480
    y_ratio: 0.514
    width_ratio: 0.040
    height_ratio: 0.012
  heal_below_percent: 55
  emergency_below_percent: 20
  heal_key: "f8"
  emergency_key: "f9"
  cooldown_seconds: 0.8

targeting:
  template_threshold: 0.56
  grayscale_threshold: 0.58
  edge_threshold: 0.42
  scales: [0.90, 1.00, 1.10]
  click_y_offset: 0
  max_target_distance_px: 700
  min_target_distance_px: 35
  excluded_regions:
    - [0.00, 0.00, 0.41, 0.11]
    - [0.00, 0.66, 0.38, 1.00]
    - [0.77, 0.00, 1.00, 0.34]

movement:
  enabled: true
  min_radius_px: 150
  max_radius_px: 330
  click_delay_seconds: 0.20

loot:
  enabled: true
  # Your server already reports "Pet auto-loot enabled". This click sweep is
  # an extra fallback for anything that still appears on the ground.
  sweep_after_target_disappears: true
  settle_delay_seconds: 0.18
  radius_px: 24
  rings: 2
  points_per_ring: 8
  click_delay_seconds: 0.045

debug:
  save_detection_frame: true
  output_path: "debug_last.jpg"
